<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <!-- Proper responsive viewport — allows user pinch zoom for accessibility -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OurSpace | Encrypted Communication & Calls</title>
    <meta name="description" content="Join end-to-end encrypted audio and video calls via secure private links. Zero phone numbers, zero data collection." />
    <meta name="theme-color" content="#7b2fbe" />

    <!-- Open Graph -->
    <meta property="og:title" content="OurSpace – Encrypted Calls & Messaging" />
    <meta property="og:description" content="A private space for two. Zero-knowledge end-to-end encrypted calls." />
    <meta property="og:type" content="website" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind for legacy call components -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c084fc',
                400: '#e91e8c',
                500: '#7b2fbe',
                600: '#6d28d9',
                700: '#5b21b6',
                800: '#4c1d95',
                900: '#2e1065',
                950: '#170530',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
